# Netlify configuration
[build]
  publish = "dist"
  command = "npm install && npm run build"

# Ensure markdown files are served with correct content type
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=UTF-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/blogs/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=UTF-8"
    Access-Control-Allow-Origin = "*"

# Redirect rules for React Router SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

